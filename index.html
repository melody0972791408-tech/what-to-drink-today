<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>今天喝什麼？｜手搖飲命運轉盤</title>
<style>
:root{--bg:#f8f6ef;--paper:#fffefa;--ink:#39483b;--muted:#829080;--green:#6c876d;--light:#e9efe5;--line:#e3e5dd;--brown:#a8896e;--shadow:0 18px 55px #4e64551a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 8%,#eef2e7 0,transparent 32%),radial-gradient(circle at 90% 75%,#f4e7df 0,transparent 35%),var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;min-height:100vh}button{font:inherit;cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid #a1bea1;outline-offset:3px}.shell{max-width:1100px;margin:auto;padding:42px 20px 36px}.header{text-align:center;margin:0 0 32px}.eyebrow{font-size:12px;letter-spacing:.32em;color:var(--green);font-weight:800}.header h1{font-size:clamp(34px,5vw,54px);letter-spacing:.08em;margin:10px 0 8px;font-weight:800}.header p{margin:0;color:#7b8579;font-size:15px}.layout{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(310px,.82fr);gap:24px}.panel{background:var(--paper);border:1px solid #e9e9e0;border-radius:28px;box-shadow:var(--shadow)}.wheel-panel{text-align:center;padding:29px 24px 30px}.section-top{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;margin-bottom:18px}.tag{font-size:11px;letter-spacing:.12em;border-radius:100px;background:#edf1e8;color:#607b62;padding:9px 13px;font-weight:700}.hint{font-size:12px;color:#98a096}.wheel-wrap{position:relative;max-width:468px;margin:0 auto 13px;aspect-ratio:1;display:grid;place-items:center;filter:drop-shadow(0 10px 18px #5e775020)}canvas{width:100%;height:100%;display:block}.pointer{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:31px solid #39483b;z-index:3;filter:drop-shadow(0 3px 3px #344c3538)}.spin-button{background:var(--green);color:white;font-weight:800;letter-spacing:.08em;border:0;border-radius:999px;padding:16px 40px;box-shadow:0 9px 20px #6c876d40;min-width:220px;transition:transform .2s,background .2s}.spin-button:not(:disabled):hover{background:#587359;transform:translateY(-2px)}.status{color:#859282;font-size:13px;min-height:24px;margin-top:15px}.side{padding:29px 26px}.side h2{font-size:20px;margin:0 0 7px}.sub{font-size:13px;color:#909b8d;margin:0}.divider{height:1px;background:var(--line);margin:23px 0 19px}.tools{display:flex;gap:7px;flex-wrap:wrap}.pill{background:#f4f5ef;border:1px solid #e5e8df;color:#677b66;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:700}.pill:hover{background:#eaf0e6}.count{font-size:12px;color:#889589;margin:13px 0 13px}.brands{display:grid;grid-template-columns:1fr 1fr;gap:9px}.brand{display:flex;align-items:center;gap:8px;padding:12px 10px;border:1px solid #e8e9e1;border-radius:13px;background:#fff;cursor:pointer;user-select:none;font-size:13px;transition:background .15s,border-color .15s}.brand:has(input:checked){background:#f0f4ec;border-color:#bfd2ba}.brand input{width:17px;height:17px;accent-color:var(--green);margin:0;flex-shrink:0}.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.side-note{font-size:12px;color:#92a093;line-height:1.75;margin:20px 0 0}.footer{text-align:center;color:#9aa69a;font-size:12px;margin-top:30px;letter-spacing:.08em}.overlay{position:fixed;inset:0;background:#27392cc7;display:none;align-items:center;justify-content:center;z-index:10;padding:20px}.overlay.open{display:flex}.modal{position:relative;background:var(--paper);border-radius:30px;padding:42px 34px 34px;text-align:center;width:min(100%,420px);box-shadow:0 30px 85px #17251c60;animation:pop .32s cubic-bezier(.2,1.6,.3,1)}.modal .tiny{font-size:12px;color:#849781;letter-spacing:.2em;font-weight:800}.modal h2{font-size:36px;margin:15px 0;color:#405941}.modal p{font-size:14px;color:#829081;line-height:1.7}.cup{font-size:47px}.modal-actions{display:flex;gap:10px;margin-top:24px}.modal-actions button{flex:1;border-radius:99px;padding:13px 12px;font-weight:800;border:0}.again{background:var(--green);color:white}.close{background:#eaf0e7;color:#5b765c}.x{position:absolute;right:16px;top:12px;background:transparent;border:0;color:#9da99e;font-size:28px;padding:4px 10px}@keyframes pop{from{opacity:0;transform:scale(.82) translateY(18px)}to{opacity:1;transform:scale(1) translateY(0)}}.confetti{position:absolute;pointer-events:none;inset:0;overflow:hidden;border-radius:30px}.confetti i{position:absolute;top:-20px;width:7px;height:15px;animation:fall 2.2s ease-out forwards;opacity:0}@keyframes fall{0%{transform:translateY(-30px) rotate(0);opacity:1}100%{transform:translateY(460px) rotate(650deg);opacity:0}}@media(max-width:800px){.layout{grid-template-columns:1fr}.shell{padding-top:27px}.side{padding:25px 20px}.wheel-panel{padding:20px 14px 24px}.header{margin-bottom:23px}.wheel-wrap{max-width:420px}}@media(max-width:390px){.brands{grid-template-columns:1fr}.modal h2{font-size:30px}}@media(prefers-reduced-motion:reduce){.modal{animation:none}.confetti i{animation:none}.spin-button{transition:none}}

@media(max-width:520px){.shell{padding:18px 10px 25px}.side{padding:21px 15px}.brands{gap:7px}.brand{font-size:12px;padding:10px 7px}.wheel-wrap{max-width:min(100%,390px)}.modal{padding:34px 20px 24px}.modal-actions{flex-wrap:wrap}.section-top .hint{display:none}}.sound-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f0f4ed;border:1px solid #d9e4d6;padding:12px 13px;border-radius:13px;margin:16px 0 0}.sound-controls label{font-size:13px;font-weight:700}.sound-controls input{width:20px;height:20px;accent-color:var(--green)}.extra-section{margin-top:20px;padding-top:19px;border-top:1px solid var(--line)}.extra-section h3{font-size:15px;margin:0 0 8px}.row-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.field{width:100%;min-width:0;padding:11px 12px;border:1px solid #dfe5dc;border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-size:13px}.field:focus{outline:2px solid #a4bea5}.field-wrap{display:grid;gap:8px;margin-top:11px}.add-button{background:var(--green);color:#fff;border:0;border-radius:12px;padding:11px 15px;font-weight:700}.secondary-button{border:1px solid #d7e1d3;background:#f1f5ee;border-radius:10px;padding:9px 12px;color:#587258;font-weight:700}.mini-remove{border:0;background:transparent;color:#a16d63;font-size:17px;padding:3px 4px;margin-left:auto}.brand{min-width:0}.brand span{flex:1}.brand:has(.mini-remove){padding-right:7px}.help{color:#8d978c;font-size:12px;line-height:1.65;margin:8px 0}.history-list{font-size:12px;color:#677a66;line-height:1.9;max-height:115px;overflow:auto}.error{color:#a65d4b;font-size:12px;min-height:18px}.menu-link{display:block;background:#eaf0e7;color:#4b7150;border-radius:99px;text-decoration:none;padding:12px;font-weight:800;margin-top:15px}.menu-link[hidden]{display:none}.modal-actions{margin-top:14px}select.field{max-width:185px}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #a1bea1;outline-offset:3px}
</style>
</head>
<body>
<main class="shell">
<header class="header"><div class="eyebrow">WHAT TO DRINK TODAY?</div><h1>今天喝什麼？</h1><p>選擇障礙？就讓命運幫你決定吧 ☕</p></header>
<div class="layout">
<section class="panel wheel-panel" aria-label="命運轉盤"><div class="section-top"><span class="tag">✦ 今日手搖運勢</span><span class="hint">轉一轉，遇見今天的好心情</span></div><div class="wheel-wrap"><canvas id="wheel" width="900" height="900" role="img" aria-label="手搖飲品牌隨機轉盤"></canvas><div class="pointer" aria-hidden="true"></div></div><button id="spin" class="spin-button">✦ 幫我決定！</button><div id="status" class="status" role="status" aria-live="polite">目前有 12 家品牌等待命運安排</div><div class="sound-controls"><label for="sound-on">轉盤音效 <span aria-hidden="true">♪</span></label><input type="checkbox" id="sound-on" aria-label="開啟轉盤音效"></div></section>
<aside class="panel side"><h2>我的候選清單 <span aria-hidden="true">🍵</span></h2><p class="sub">選擇想喝的品牌，轉盤會跟著更新。</p><div class="divider"></div><div class="tools"><button class="pill" id="all">全選</button><button class="pill" id="none">取消全選</button><button class="pill" id="reset">恢復預設</button></div><div id="count" class="count"></div><div id="brands" class="brands" aria-label="品牌勾選清單"></div><div class="extra-section"><h3>＋ 新增我的飲料店</h3><p class="help">自訂品牌會加入轉盤；菜單網址可留白，日後再編輯。</p><form class="field-wrap" id="add-form"><input class="field" id="new-name" maxlength="35" placeholder="品牌名稱，例如：珍煮丹" required aria-label="新增品牌名稱"><input class="field" id="new-url" type="url" placeholder="官方菜單網址（選填）" aria-label="新增品牌菜單網址"><button class="add-button" type="submit" id="add-brand">新增品牌 ＋</button><span id="form-error" class="error" role="alert"></span></form></div><div class="extra-section"><h3>近期喝過的排除設定</h3><div class="row-inline"><label for="exclude">自動排除</label><select id="exclude" class="field"><option value="0">不排除</option><option value="1">最近 1 次</option><option value="3">最近 3 次</option><option value="5">最近 5 次</option></select></div><p id="eligible-note" class="help"></p><div class="row-inline"><button id="clear-history" class="secondary-button">清除抽選紀錄</button></div><div id="history-list" class="history-list" aria-live="polite"></div></div><p class="side-note">小提醒：每個符合條件的品牌機率相同，個人設定會自動保存在目前瀏覽器。</p></aside>
</div><footer class="footer">一杯飲料，一點好運 · MADE WITH ♡</footer>
</main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="result-title" aria-hidden="true"><div class="modal"><div class="confetti" id="confetti"></div><button class="x" id="x" aria-label="關閉結果">×</button><div class="cup" aria-hidden="true">🧋</div><div class="tiny">TODAY'S LUCKY PICK</div><h2 id="result-title"></h2><p>就是這家！今天的快樂交給它 ✨</p><a id="menu-link" class="menu-link" href="#" target="_blank" rel="noopener noreferrer" hidden>查看品牌菜單 ↗</a><p id="no-menu" class="help" hidden>尚未設定菜單連結</p><div class="modal-actions"><button class="close" id="close">關閉</button><button class="again" id="again">再轉一次 ↻</button></div></div></div>
<script>
(()=>{'use strict';
const DEFAULT=['50嵐','可不可熟成紅茶','迷客夏','清心福全','麻古茶坊','得正','龜記茗品','一沐日','茶湯會','萬波島嶼紅茶','大苑子','五桐號'];
// 官方入口網址僅供使用者方便查閱；品牌可在清單中修改連結。
const MENU={'50嵐':'https://www.50lan.com/','可不可熟成紅茶':'https://www.kebuke.com/','迷客夏':'https://www.milksha.com/','清心福全':'https://www.chingshin.tw/','麻古茶坊':'https://www.maculife.com.tw/','得正':'https://www.dejeng.com/','龜記茗品':'https://www.guiji.com.tw/','一沐日':'https://www.aniceholiday.com.tw/','茶湯會':'https://tw.tp-tea.com/','萬波島嶼紅茶':'https://www.wanpotea.com/','大苑子':'https://www.dayungs.com/','五桐號':'https://www.wutong.com.tw/'};
const SHORT={'可不可熟成紅茶':'可不可','清心福全':'清心','麻古茶坊':'麻古','龜記茗品':'龜記','萬波島嶼紅茶':'萬波'};
const COLORS=['#8ea88a','#e2c8ac','#bed0b8','#f0dccc','#a8bd9d','#d8b6a6','#d2dfc9','#e7cf9f','#9fb7aa','#e8dad0','#b3c69e','#d1c2ae'];
const $=id=>document.getElementById(id),canvas=$('wheel'),ctx=canvas.getContext('2d'),spin=$('spin'),status=$('status'),brands=$('brands'),overlay=$('overlay');
const STORAGE='what-to-drink-v11';
const initial=()=>DEFAULT.map(name=>({name,url:MENU[name]||'',active:true,custom:false}));
let soundOn=false,audioCtx=null,lastTick=-1;let records=initial(),history=[],exclude=0,items=[],rotation=0,spinning=false,frame=0,previousFocus=null,lastWinner=null;
const TAU=Math.PI*2,normalize=a=>((a%TAU)+TAU)%TAU;
function safeUrl(raw){if(!raw||!raw.trim())return '';try{const u=new URL(raw.trim());return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
function load(){try{const data=JSON.parse(localStorage.getItem(STORAGE));if(!data||!Array.isArray(data.records))return;const seen=new Set();const valid=[];for(const rec of data.records.slice(0,120)){if(!rec||typeof rec.name!=='string')continue;const name=rec.name.trim().slice(0,35),key=name.toLocaleLowerCase();if(!name||seen.has(key))continue;seen.add(key);valid.push({name,url:safeUrl(typeof rec.url==='string'?rec.url:''),active:!!rec.active,custom:!DEFAULT.includes(name)})}for(const name of DEFAULT)if(!seen.has(name.toLocaleLowerCase()))valid.push({name,url:MENU[name]||'',active:true,custom:false});records=valid;history=Array.isArray(data.history)?data.history.filter(x=>typeof x==='string').slice(-100):[];exclude=[0,1,3,5].includes(data.exclude)?data.exclude:0;soundOn=data.soundOn===true}catch(e){console.warn('無法讀取先前設定',e)}}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify({records,history,exclude,soundOn}))}catch(e){status.textContent='瀏覽器無法儲存設定，仍可繼續使用'}}
function tone(freq=660,duration=.07,volume=.035){if(!soundOn)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;o.type='sine';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(volume,t);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+duration+.02)}catch(e){console.warn('音效無法播放',e)}}
function finishSound(){tone(660,.12,.055);setTimeout(()=>tone(880,.16,.045),130);setTimeout(()=>tone(1046,.25,.035),280)}
function label(name){return SHORT[name]||name}
function fitName(name,n,r){let t=label(name);if(t.length>7)t=t.slice(0,6)+'…';return t}
function eligible(){const recent=exclude>0?history.slice(-exclude):[];const excluded=new Set(recent);return records.filter(r=>r.active&&!excluded.has(r.name)).map(r=>r.name)}
function draw(){const W=900,c=W/2,r=417;ctx.clearRect(0,0,W,W);ctx.save();ctx.translate(c,c);ctx.rotate(rotation);const n=items.length;ctx.beginPath();ctx.arc(0,0,r+11,0,TAU);ctx.fillStyle='#fffefa';ctx.fill();if(!n){ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fillStyle='#ebefe8';ctx.fill();ctx.fillStyle='#778c79';ctx.textAlign='center';ctx.font='bold 33px sans-serif';ctx.fillText('請先選擇品牌',0,15)}else{const step=TAU/n;for(let i=0;i<n;i++){const a=-Math.PI/2-step/2+i*step,b=a+step;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,a,b);ctx.closePath();ctx.fillStyle=COLORS[i%COLORS.length];ctx.fill();ctx.strokeStyle='#fffefa';ctx.lineWidth=5;ctx.stroke();ctx.save();ctx.rotate(-Math.PI/2+i*step);ctx.translate(r*.64,0);ctx.rotate(Math.PI/2);ctx.fillStyle='#344936';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`700 ${n>10?26:n>7?29:34}px sans-serif`;ctx.fillText(fitName(items[i],n,r),0,0,r*.55);ctx.restore()}}ctx.beginPath();ctx.arc(0,0,48,0,TAU);ctx.fillStyle='#fffefa';ctx.fill();ctx.lineWidth=6;ctx.strokeStyle='#dce6d8';ctx.stroke();ctx.fillStyle='#658468';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 20px sans-serif';ctx.fillText('DRINK',0,1);ctx.restore()}
function render(){items=eligible();brands.replaceChildren();for(const rec of records){const el=document.createElement('label');el.className='brand';const input=document.createElement('input');input.type='checkbox';input.checked=rec.active;input.disabled=spinning;input.addEventListener('change',()=>{rec.active=input.checked;save();render()});const span=document.createElement('span');span.textContent=rec.name;span.title=rec.name;el.append(input,span);const edit=document.createElement('button');edit.type='button';edit.className='mini-remove';edit.textContent='✎';edit.title='編輯 '+rec.name+' 的菜單網址';edit.setAttribute('aria-label',edit.title);edit.disabled=spinning;edit.addEventListener('click',e=>{e.preventDefault();editUrl(rec.name)});el.append(edit);if(rec.custom){const del=document.createElement('button');del.type='button';del.className='mini-remove';del.textContent='×';del.title='刪除 '+rec.name;del.setAttribute('aria-label',del.title);del.disabled=spinning;del.addEventListener('click',e=>{e.preventDefault();records=records.filter(r=>r!==rec);save();render()});el.append(del)}brands.append(el)}const active=records.filter(r=>r.active).length;$('count').textContent=`已選擇 ${active} / ${records.length} 家品牌（本輪符合資格：${items.length} 家）`;spin.disabled=spinning||items.length===0;status.textContent=spinning?'命運轉盤旋轉中…':items.length?`目前有 ${items.length} 家品牌等待命運安排`:active?'近期排除後沒有可抽的品牌，請降低排除次數或清除紀錄':'請至少勾選一家品牌';$('eligible-note').textContent=exclude?`目前排除最近 ${exclude} 次結果，共 ${new Set(history.slice(-exclude)).size} 個不同品牌。`:'目前沒有排除品牌。';$('exclude').value=String(exclude);$('sound-on').checked=soundOn;$('exclude').disabled=spinning;$('add-brand').disabled=spinning;$('new-name').disabled=spinning;$('new-url').disabled=spinning;for(const id of ['all','none','reset','clear-history'])$(id).disabled=spinning;$('history-list').textContent=history.length?'最近抽選：'+history.slice(-8).reverse().join(' → '):'尚無抽選紀錄';draw()}
function editUrl(name){const rec=records.find(r=>r.name===name);if(!rec)return;const raw=prompt(`編輯「${name}」菜單網址（可留白）`,rec.url);if(raw===null)return;const url=safeUrl(raw);if(raw.trim()&&!url){alert('請輸入以 http:// 或 https:// 開頭的有效網址');return}rec.url=url;save();render()}
function secureRandom(n){if(window.crypto&&crypto.getRandomValues){const limit=Math.floor(4294967296/n)*n;const buf=new Uint32Array(1);let k;do{crypto.getRandomValues(buf);k=buf[0]}while(k>=limit);return k%n}return Math.floor(Math.random()*n)}
function start(){if(spinning||!items.length)return;const chosen=secureRandom(items.length),winner=items[chosen],n=items.length,step=TAU/n;spinning=true;render();const startAngle=rotation,startTime=performance.now(),duration=window.matchMedia('(prefers-reduced-motion: reduce)').matches?650:3900;lastTick=-1;const endNormalized=normalize(-chosen*step),delta=normalize(endNormalized-normalize(rotation)),target=startAngle+TAU*6+delta;function tick(now){const t=Math.min(1,(now-startTime)/duration),ease=1-Math.pow(1-t,4);rotation=startAngle+(target-startAngle)*ease;draw();const sector=Math.floor(normalize(rotation)/step);if(sector!==lastTick&&t<.92){lastTick=sector;tone(380+Math.round(120*(1-t)),.038,.014)}if(t<1){frame=requestAnimationFrame(tick)}else{rotation=normalize(target);spinning=false;render();history.push(winner);history=history.slice(-100);save();finishSound();show(winner)}}frame=requestAnimationFrame(tick)}
function show(winner){previousFocus=document.activeElement;$('result-title').textContent=winner;lastWinner=winner;const rec=records.find(r=>r.name===winner),url=rec&&safeUrl(rec.url);$('menu-link').hidden=!url;$('no-menu').hidden=!!url;if(url)$('menu-link').href=url;else $('menu-link').removeAttribute('href');overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');const conf=$('confetti');conf.replaceChildren();for(let i=0;i<24;i++){const bit=document.createElement('i');bit.style.left=`${Math.random()*100}%`;bit.style.background=COLORS[i%COLORS.length];bit.style.animationDelay=`${Math.random()*.35}s`;conf.append(bit)}$('again').focus()}
function hide(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');$('confetti').replaceChildren();render();if(previousFocus&&typeof previousFocus.focus==='function')previousFocus.focus()}
$('sound-on').addEventListener('change',e=>{soundOn=e.target.checked;save();if(soundOn)tone(740,.11,.035)});
$('all').addEventListener('click',()=>{records.forEach(r=>r.active=true);save();render()});$('none').addEventListener('click',()=>{records.forEach(r=>r.active=false);save();render()});$('reset').addEventListener('click',()=>{records=initial();history=[];exclude=0;rotation=0;soundOn=false;save();render()});
$('exclude').addEventListener('change',e=>{exclude=Number(e.target.value);save();render()});$('clear-history').addEventListener('click',()=>{history=[];save();render()});
$('add-form').addEventListener('submit',e=>{e.preventDefault();const name=$('new-name').value.trim(),raw=$('new-url').value.trim(),url=safeUrl(raw),error=$('form-error');error.textContent='';if(!name){error.textContent='請輸入品牌名稱';return}if(records.some(r=>r.name.toLocaleLowerCase()===name.toLocaleLowerCase())){error.textContent='這個品牌已經在清單裡了';return}if(raw&&!url){error.textContent='請輸入有效的 http 或 https 菜單網址';return}records.push({name,url,active:true,custom:true});$('new-name').value='';$('new-url').value='';save();render()});
spin.addEventListener('click',start);$('again').addEventListener('click',()=>{hide();start()});$('close').addEventListener('click',hide);$('x').addEventListener('click',hide);overlay.addEventListener('click',e=>{if(e.target===overlay)hide()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))hide();if(e.key==='Tab'&&overlay.classList.contains('open')){const controls=[$('x'),...(!$('menu-link').hidden?[$('menu-link')]:[]),$('close'),$('again')],first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});load();render();
})();
</script>
</body></html>
